# Development stack (Vite HMR + API watch). For production images:
#   docker compose -f compose.yaml -f compose.prod.yaml up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: atmos
      POSTGRES_DB: atmos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos -d atmos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://atmos:atmos@postgres:5432/atmos
      REDIS_URL: redis://redis:6379
      # Bind mounts do not deliver file events; poll so tsc --watch sees host edits.
      TSC_WATCHFILE: PriorityPollingInterval
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/contracts/src:/app/packages/contracts/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/contracts/src:/app/packages/contracts/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
